name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # Format, lint, SQL tests and doctests. No database, so the db tests pass trivially.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  # MySQL integration tests (same settings as docker-compose.yml). The Oracle
  # tests pass trivially here: no RUSTIQUE_TEST_ORACLE_URL, no Instant Client needed.
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: orm_test
          MYSQL_USER: orm
          MYSQL_PASSWORD: secret
        ports: ["13306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RUSTIQUE_TEST_MYSQL_URL: mysql://orm:secret@127.0.0.1:13306/orm_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # Oracle integration tests against a real 19c database.
  # Image: doctorkirk/oracle-19c (Oracle 19.3/19.9 EE, built from Oracle's
  # docker-images; Docker Hub, no login; ~5 GB, last pushed 2021). It is a
  # non-CDB database, so there is no PDB: the service name is the SID. The
  # `orm` user is created below. If this image disappears, fall back to
  # gvenzl/oracle-xe:21-slim-faststart (21c, as in docker-compose.yml), which
  # does not prove 19c compatibility. Credentials are test literals only.
  oracle-19c:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ORACLE_SID: ORCL19
      RUSTIQUE_TEST_ORACLE_URL: oracle://orm:secret@127.0.0.1:11521/ORCL19
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the 5 GB image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Start Oracle 19c
        run: |
          docker run -d --name oracle -p 11521:1521 \
            -e ORACLE_SID="$ORACLE_SID" -e ORACLE_PWD=secret \
            -e ORACLE_CHARACTERSET=AL32UTF8 \
            doctorkirk/oracle-19c:19.9
      - name: Install Oracle Instant Client
        run: |
          sudo apt-get update && sudo apt-get install -y libaio1 unzip
          curl -fsSL -o ic.zip https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip
          mkdir "$RUNNER_TEMP/ic" && unzip -q ic.zip -d "$RUNNER_TEMP/ic"
          echo "LD_LIBRARY_PATH=$(dirname "$(find "$RUNNER_TEMP/ic" -name libclntsh.so | head -1)")" >> "$GITHUB_ENV"
          # The 23.x client's out-of-band breaks fail through Docker NAT with ORA-12637.
          echo "DISABLE_OOB=ON" > "$RUNNER_TEMP/ic/sqlnet.ora"
          echo "TNS_ADMIN=$RUNNER_TEMP/ic" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for the database (first start creates it, 5-15 min)
        run: |
          for i in $(seq 1 120); do
            if docker logs oracle 2>&1 | grep -q "DATABASE IS READY TO USE"; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' oracle)" != true ]; then break; fi
            sleep 10
          done
          docker logs --tail 100 oracle
          exit 1
      - name: Create test user
        run: |
          docker exec -i oracle sqlplus -S / as sysdba <<'SQL'
          WHENEVER SQLERROR EXIT SQL.SQLCODE
          CREATE USER orm IDENTIFIED BY secret;
          GRANT CONNECT, RESOURCE, CREATE VIEW, CREATE SEQUENCE, CREATE TRIGGER, CREATE PROCEDURE TO orm;
          GRANT UNLIMITED TABLESPACE TO orm;
          EXIT
          SQL
      - run: cargo test --workspace --all-features
