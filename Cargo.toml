[workspace]
members = ["rustique", "rustique-macros"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Eworkssk/rustique"

[workspace.dependencies]
chrono = "0.4"
itertools = "0.14"
# Pure-Rust compression, no C zlib; TLS comes from the `rustique` crate's `mysql-tls` feature.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"] }
oracle = { version = "0.6", features = ["chrono"] }
rustique-orm-macros = { path = "rustique-macros", version = "0.2.2" }
proc-macro2 = "1"
quote = "1"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = "1"
tracing = "0.1"
# Already built by `mysql_async`; `v7` adds ordered ids for `uuid` / `ulid` model keys.
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
